<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Signup</title>

    <style>
        /* ---------- Reset ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
        }

        /* ---------- Left Section ---------- */
        .left {
            flex: 1;
            background-color: #f9fafb;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background-color: #ffffff;
            width: 360px;
            padding: 28px;
            border-radius: 10px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
        }

        .card h2 {
            text-align: center;
            font-size: 20px;
            margin-bottom: 16px;
        }

                /* ---------- Google Button ---------- */
            .google-btn {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            background-color: #000;
            color: #fff;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .google-icon {
            width: 18px;
            height: 18px;
        }

        /* ---------- Divider ---------- */
        .divider {
            text-align: center;
            margin: 16px 0;
            font-size: 12px;
            color: #999;
            position: relative;
        }

        .divider::before,
        .divider::after {
            content: "";
            height: 1px;
            width: 40%;
            background-color: #e5e7eb;
            position: absolute;
            top: 50%;
        }

        .divider::before {
            left: 0;
        }

        .divider::after {
            right: 0;
        }

        /* ---------- Form ---------- */
        .form-group {
            margin-bottom: 12px;
        }

        label {
            font-size: 12px;
            display: block;
            margin-bottom: 4px;
        }

        input {
            width: 100%;
            padding: 10px;
            font-size: 13px;
            border-radius: 6px;
            border: 1px solid #d1d5db;
            outline: none;
        }

        input:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.15);
        }

        /* ---------- Submit ---------- */
        .signup-btn {
            width: 100%;
            margin-top: 12px;
            padding: 10px;
            background-color: #4f46e5;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
        }

        /* ---------- Right Section ---------- */
        .right {
            flex: 1;
            background-color: #4f46e5;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            text-align: center;
        }

        .right h1 {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .right p {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 32px;
        }

        .logo {
            max-width: 360px;
            width: 100%;
        }

        /* ---------- Responsive ---------- */
        @media (max-width: 900px) {
            body {
                flex-direction: column;
            }

            .right {
                order: -1;
            }
        }
    </style>
</head>

<body>

    <!-- Left Signup Card -->
    <div class="left">
        <div class="card">
            <h2>Get Started Now</h2>

            <button class="google-btn">
                <img src="https://www.google.com/favicon.ico" alt="Google" class="google-icon" />
                Sign in with Google
            </button>

            <div class="divider">Or</div>

            <form>
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" placeholder="Enter here" />
                </div>

                <div class="form-group">
                    <label>Mail Id</label>
                    <input type="email" placeholder="Enter here" />
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" placeholder="Enter here" />
                </div>

                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" placeholder="Enter here" />
                </div>

                <button class="signup-btn">Sign up</button>
            </form>
        </div>
    </div>

    <!-- Right Illustration Section -->
    <div class="right">
        <h1>The simplest way to manage your workforce</h1>
        <p>Start of journey with us now</p>

        <img
            src="/home/ameen-khan/Frontend-Fundamentals/Pasted-image.png"
            alt="Illustration"
            class="logo"
        />
    </div>

</body>
</html>
